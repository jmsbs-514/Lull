<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Lull</title>
<link rel="stylesheet" href="/panel.css">
</head>
<body>
  <div class="bar">
    <div class="brand">
      <span class="dot"></span>
      <span>Lull</span>
    </div>
    <button class="x" id="close">×</button>
  </div>

  <div class="scroll">
    <div class="preview" id="preview">
      <div class="preview-live"><iframe id="pvFrame" src="/lyric.html" scrolling="no" title="歌词预览"></iframe></div>
      <div class="preview-inner">
        <div class="pv-rhythm" id="pvRhythm" aria-hidden="true"></div>
        <div class="pv-rule" id="pvRule" aria-hidden="true"></div>
        <div class="pv-sub" id="pvSub">愛し愛</div>
        <div class="pv-main" id="pvMain">今はただ愛したいだけ</div>
      </div>
      <div class="preview-tag" id="previewTag">桌面上的样子</div>
    </div>

    <section>
      <h2>预设</h2>
      <div class="presets" id="presets"></div>
      <p class="hint">一次设好样式、配色、律动和律动透明度。</p>
    </section>

    <section>
      <h2>外观</h2>
      <div class="styles" id="styles"></div>
    </section>

    <section>
      <h2>调色板</h2>
      <div class="palettes" id="palettes"></div>

      <div class="row color-row">
        <label>文字色</label>
        <input type="color" id="inkColor">
        <span class="val hex" id="inkVal">#FFFFFF</span>
      </div>

      <div class="row color-row">
        <label>强调色</label>
        <input type="color" id="accentColor">
        <span class="val hex" id="accentVal">#A996FF</span>
      </div>

      <div class="row color-row">
        <label>背景色</label>
        <input type="color" id="surfaceColor">
        <span class="val hex" id="surfaceVal">#16141F</span>
      </div>

      <div class="row palette-foot">
        <span class="hint" id="paletteHint">跟随外观</span>
        <button class="link" id="paletteReset">恢复默认</button>
      </div>
      <p class="hint">调色板作用于歌词层和播放卡片；面板本身保持深色。</p>
    </section>

    <section>
      <h2>律动</h2>
      <div class="rhythms" id="rhythms"></div>
      <p class="hint">整行 32 段频谱，从左到右低频到高频；没有声音时会收缩隐藏。</p>
      <div class="row">
        <label>律动透明度</label>
        <input type="range" id="rhythmOpacity" min="10" max="100" step="1">
        <span class="val" id="rhythmOpacityVal">100%</span>
      </div>
      <div class="row color-row">
        <label>律动颜色</label>
        <input type="color" id="rhythmColor">
        <span class="val hex" id="rhythmColorVal">#A996FF</span>
      </div>
      <div class="row palette-foot">
        <span class="hint" id="rhythmColorHint">跟随强调色</span>
        <button class="link" id="rhythmColorReset">跟随强调色</button>
      </div>
    </section>

    <section>
      <h2>区域</h2>
      <div class="row">
        <label>宽度</label>
        <input type="range" id="areaWidth" min="420" max="1600" step="10">
        <span class="val" id="areaWidthVal">804</span>
      </div>
      <div class="row">
        <label>高度</label>
        <input type="range" id="areaHeight" min="100" max="600" step="5">
        <span class="val" id="areaHeightVal">100</span>
      </div>
      <p class="hint">解锁歌词后，也可以拖动右下角整体缩放。</p>
    </section>

    <section>
      <h2>尺寸</h2>

      <div class="row">
        <label>主行字号</label>
        <input type="range" id="fontSize" min="18" max="54" step="1">
        <span class="val" id="fontSizeVal">30</span>
      </div>

      <div class="row">
        <label>副行字号</label>
        <input type="range" id="subSize" min="11" max="30" step="1">
        <span class="val" id="subSizeVal">15</span>
      </div>

      <div class="row">
        <label>不透明度</label>
        <input type="range" id="opacity" min="30" max="100" step="1">
        <span class="val" id="opacityVal">92%</span>
      </div>
    </section>

    <section>
      <h2>内容</h2>
      <div class="row toggles">
        <label class="switch">
          <input type="checkbox" id="showTranslation">
          <span></span>
          显示翻译
        </label>
        <label class="switch">
          <input type="checkbox" id="showNext">
          <span></span>
          没翻译时显示下一句
        </label>
      </div>
    </section>

    <section>
      <h2>位置</h2>
      <div class="row">
        <button class="btn" id="unlock">调整位置</button>
        <button class="btn" id="recenter">回到屏幕中央</button>
      </div>
      <p class="hint" id="posHint">当前锁定，鼠标可以穿过歌词层。</p>
    </section>

    <div class="now" id="now"></div>
  </div>

  <script src="/color.js"></script>
  <script src="/panel.js"></script>
</body>
</html>
